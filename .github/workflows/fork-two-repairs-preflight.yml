name: Sandbox path and PID probe focused validation
'on':
  push:
    branches:
    - codex/ci-two-repairs-preflight-20261015
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: '8388608'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: codex-rs
    name: Sandbox symlink ${{ matrix.case.mode }}
    strategy:
      fail-fast: false
      matrix:
        case:
        - mode: baseline
          sha: e89b7c442c0433ad5167e72a5a25bb6d0712766a
        - mode: fixed
          sha: 0456622cfc4c393e76f8d5d66b32d462ea0325d0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.case.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify tested source
      shell: bash
      env:
        TESTED: ${{ matrix.case.sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED" ]]

        printf "tested=%s\nworkflow=%s\n" "$TESTED" "${{ github.workflow_sha }}"

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt,clippy,rust-src
    - name: Verify pinned Rust
      shell: bash
      run: 'rustc --version --verbose

        cargo --version

        rustc --version | grep -F "rustc 1.95.0 "'
    - name: Linux build dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev bubblewrap
    - name: Actual sandbox executable with symlinked layout
      shell: bash
      env:
        PROBE_MODE: ${{ matrix.case.mode }}
      run: "python3 - <<'PY'\n\"\"\"Exercise the real restricted sandbox with a symlinked\
        \ executable layout.\"\"\"\nfrom pathlib import Path\nimport hashlib\nimport\
        \ json\nimport os\nimport shutil\nimport subprocess\nimport tempfile\n\nmode\
        \ = os.environ['PROBE_MODE']\nassert mode in ('baseline', 'fixed')\nbwrap_build\
        \ = subprocess.run(['cargo','build','--locked','-p','codex-bwrap','--bin','bwrap','--message-format=json'],text=True,stdout=subprocess.PIPE,check=True)\n\
        bwrap_artifacts = [json.loads(line) for line in bwrap_build.stdout.splitlines()\
        \ if line.startswith('{')]\nbwrap_paths = [Path(a['executable']) for a in\
        \ bwrap_artifacts if a.get('reason') == 'compiler-artifact' and a.get('executable')\
        \ and a['target']['name'] == 'bwrap']\nassert len(bwrap_paths) == 1\nbwrap\
        \ = bwrap_paths[0]\nwith bwrap.open('rb') as stream:\n    bwrap_digest = hashlib.file_digest(stream,'sha256').hexdigest()\n\
        os.environ['CODEX_BWRAP_SHA256'] = bwrap_digest\nos.environ['CARGO_BIN_EXE_bwrap']\
        \ = str(bwrap)\ncommand = ['cargo', 'test', '--locked', '-p', 'codex-linux-sandbox',\
        \ '--test', 'all', '--no-run', '--message-format=json']\nbuild = subprocess.run(command,\
        \ text=True, stdout=subprocess.PIPE, check=True)\nartifacts = [json.loads(line)\
        \ for line in build.stdout.splitlines() if line.startswith('{')]\nartifacts\
        \ = [a for a in artifacts if a.get('reason') == 'compiler-artifact' and a.get('executable')]\n\
        test_bins = [Path(a['executable']) for a in artifacts if a['target']['src_path'].endswith('/linux-sandbox/tests/all.rs')]\n\
        sandbox_bins = [Path(a['executable']) for a in artifacts if a['target']['name']\
        \ == 'codex-linux-sandbox' and a['target']['kind'] == ['bin']]\nassert len(test_bins)\
        \ == len(sandbox_bins) == 1, (test_bins, sandbox_bins)\ntest_bin, sandbox_bin\
        \ = test_bins[0], sandbox_bins[0]\nassert sandbox_bin.is_file() and not sandbox_bin.is_symlink()\n\
        with sandbox_bin.open('rb') as stream:\n    digest = hashlib.file_digest(stream,\
        \ 'sha256').hexdigest()\ncase = 'suite::managed_proxy::managed_proxy_mode_routes_through_bridge_and_blocks_direct_egress'\n\
        record = dict(mode=mode,logical_binary=str(sandbox_bin),sha256=digest,bwrap_sha256=bwrap_digest)\n\
        with tempfile.TemporaryDirectory(prefix='real-sandbox-helper-',dir=os.environ['RUNNER_TEMP'])\
        \ as tmp:\n    actual = Path(tmp) / sandbox_bin.name\n    resources = Path(tmp)\
        \ / 'codex-resources'\n    resources.mkdir()\n    shutil.copy2(bwrap,resources/'bwrap')\n\
        \    shutil.move(sandbox_bin, actual)\n    sandbox_bin.symlink_to(actual)\n\
        \    try:\n        assert sandbox_bin.resolve() == actual.resolve()\n    \
        \    result = subprocess.run([str(test_bin),'--exact',case,'--nocapture'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)\n\
        \        print(result.stdout,flush=True)\n        record.update(resolved_binary=str(actual),regression_exit_code=result.returncode,regression_output=result.stdout)\n\
        \        assert 'skipping' not in result.stdout.lower(), 'Focused regression\
        \ returned early instead of exercising sandbox'\n        if mode == 'baseline':\n\
        \            assert result.returncode != 0, 'Negative control unexpectedly\
        \ passed'\n            assert 'expected routed command to execute successfully'\
        \ in result.stdout\n            assert 'No such file or directory' in result.stdout\
        \ and '1 failed' in result.stdout\n            record['expected_negative_verified']\
        \ = True\n        else:\n            assert result.returncode == 0 and '1\
        \ passed; 0 failed' in result.stdout\n            record['focused_positive_verified']\
        \ = True\n            suite = subprocess.run([str(test_bin),'--nocapture'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=600)\n\
        \            print(suite.stdout,flush=True)\n            record.update(suite_exit_code=suite.returncode,suite_output=suite.stdout,suite_runtime_skip_messages=[line\
        \ for line in suite.stdout.splitlines() if 'skipping' in line.lower()])\n\
        \            assert suite.returncode == 0\n    finally:\n        sandbox_bin.unlink()\n\
        \        shutil.move(actual,sandbox_bin)\n        with sandbox_bin.open('rb')\
        \ as stream:\n            assert hashlib.file_digest(stream,'sha256').hexdigest()\
        \ == digest\n        Path(os.environ['RUNNER_TEMP'],'sandbox-symlink-evidence.json').write_text(json.dumps(record,indent=2)+'\\\
        n')\nprint(json.dumps({k:v for k,v in record.items() if not k.endswith('_output')}),flush=True)\n\
        \nPY\n"
    - name: Strict sandbox Clippy
      if: always() && !cancelled()
      run: cargo clippy --locked -p codex-linux-sandbox --tests -- -D warnings
    - name: Upload layout evidence
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      if: always() && !cancelled()
      with:
        name: sandbox-symlink-${{ matrix.case.mode }}
        path: ${{ runner.temp }}/sandbox-symlink-evidence.json
        if-no-files-found: warn
    - name: Clean worktree
      uses: ./.github/actions/check-clean-worktree
      if: always() && !cancelled()
  pid:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: '8388608'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: codex-rs
    name: PID probe release Rust1.95 20 full suites
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: df45c88a5727173caf2c7a5ecfc888b32f4aa4aa
        fetch-depth: 0
        persist-credentials: false
    - name: Verify tested source
      shell: bash
      env:
        TESTED: df45c88a5727173caf2c7a5ecfc888b32f4aa4aa
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED" ]]

        printf "tested=%s\nworkflow=%s\n" "$TESTED" "${{ github.workflow_sha }}"

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt,clippy,rust-src
    - name: Verify pinned Rust
      shell: bash
      run: 'rustc --version --verbose

        cargo --version

        rustc --version | grep -F "rustc 1.95.0 "'
    - name: Linux build dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev bubblewrap
    - name: Deterministic descriptor and live-reservation controls
      run: cargo test --locked -p codex-app-server-daemon --lib backend::pid::tests::pid_probe_
    - name: Repeat complete daemon suite twenty times
      shell: bash
      run: "set -euo pipefail\nfor attempt in $(seq 1 20); do\n printf \"FIXED_DAEMON_SUITE_ATTEMPT=%s\\\
        n\" \"$attempt\"\n cargo test --locked -p codex-app-server-daemon --lib\n\
        done\n"
    - name: Strict daemon Clippy
      if: always() && !cancelled()
      run: cargo clippy --locked -p codex-app-server-daemon --tests -- -D warnings
    - name: Clean worktree
      uses: ./.github/actions/check-clean-worktree
      if: always() && !cancelled()
