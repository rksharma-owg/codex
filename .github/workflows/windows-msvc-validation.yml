name: Windows MSVC fallback - native link A-B
'on':
  push:
    branches:
    - codex/windows-msvc-validation
permissions:
  contents: read
jobs:
  native-link:
    name: Windows native link - ${{ matrix.revision.name }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        revision:
        - name: baseline
          sha: bb64b894fd67158be0f874872e6d7bfe717e7368
        - name: fixed
          sha: fe3b5f49d7ad43a72ee4e2bbd516280a38857785
    env:
      RUST_MIN_STACK: '8388608'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.revision.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact tested source
      shell: bash
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "${{ matrix.revision.sha }}" ]]

        printf "tested=%s\nworkflow=%s\n" "${{ matrix.revision.sha }}" "${{ github.workflow_sha
        }}"

        '
    - uses: ./.github/actions/prepare-bazel-ci
      with:
        target: x86_64-pc-windows-msvc
        cache-scope: msvc-fallback-ab
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt,clippy
    - name: Verify Rust 1.95
      shell: bash
      run: 'rustc --version --verbose

        cargo --version

        rustc --version | grep -F "rustc 1.95.0 "'
    - name: Wrapper regression tests on Windows
      if: matrix.revision.name == 'fixed'
      shell: pwsh
      run: python -m unittest discover -s .github/scripts -p test_run_bazel_ci.py
    - name: Build and execute real rustls provider test
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ''
      run: './.github/scripts/run-bazel-ci.sh --windows-cross-compile --print-failed-action-summary
        --print-failed-test-logs -- test -- //codex-rs/utils/rustls-provider:rustls-provider-preinstalled-test

        '
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: msvc-fallback-${{ matrix.revision.name }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
