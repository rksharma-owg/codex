name: Daemon pruning repeated Linux diagnostic
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 58c56d1ec79988435f170e3248728c19e77b477f
        fetch-depth: 0
        persist-credentials: false
    - name: Verify repaired baseline
      shell: bash
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "58c56d1ec79988435f170e3248728c19e77b477f" ]]

        printf "baseline=%s\nworkflow=%s\n" "58c56d1ec79988435f170e3248728c19e77b477f"
        "${{ github.workflow_sha }}"

        '
    - uses: ./.github/actions/prepare-bazel-ci
      with:
        target: x86_64-unknown-linux-gnu
        cache-scope: pruning-diagnostic
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\n# Reclaim optional preinstalled SDKs that this Rust/Python/Node\
        \ matrix does not use.\n# This runs only on the disposable hosted runner,\
        \ outside the source checkout.\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n \
        \ sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc\nfi\n# Upstream\
        \ remote CI also disables the duplicate local action cache.\nprintf '\\ncommon\
        \ --disk_cache=\\n' >> \"$HOME/.bazelrc\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\
        \nbazel info --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"\
        $(grep -oE -- '--disk_cache=[^[:space:]]*' \"$rc_log\" | tail -n 1)\"\n[[\
        \ \"$last_cache_option\" == --disk_cache= ]]\n"
    - name: Repeat unchanged pruning assertion with diagnostic
      shell: bash
      env:
        TARGET: //codex-rs/app-server-daemon:app-server-daemon-unit-tests
        REPEATS: '20'
      run: 'set -euo pipefail

        ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs
        -- test --runs_per_test="$REPEATS" --local_test_jobs=1 --test_output=all --
        "$TARGET"

        '
    - name: Upload probe diagnostics
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      if: always() && !cancelled()
      with:
        name: pruning-diagnostic
        path: ${{ runner.temp }}/bazel-execution-logs
    - name: Clean worktree
      uses: ./.github/actions/check-clean-worktree
      if: always() && !cancelled()
'on':
  push:
    branches:
    - codex/ci-pruning-probe-20261015
