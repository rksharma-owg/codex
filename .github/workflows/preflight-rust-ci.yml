name: Fork preflight - rust-ci
'on':
  workflow_call:
    inputs:
      target-sha:
        type: string
        required: true
      patch-sha:
        type: string
        required: true
      base-sha:
        type: string
        required: true
      issue:
        type: string
        required: true
jobs:
  changed:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      argument_comment_lint: ${{ steps.detect.outputs.argument_comment_lint }}
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Detect changed paths (no external action)
      id: detect
      shell: bash
      run: "set -euo pipefail\n\nif true; then\n  BASE_SHA='${{ inputs.base-sha }}'\n  HEAD_SHA='${{ inputs.target-sha\
        \ }}'\n  echo \"Base SHA: $BASE_SHA\"\n  echo \"Head SHA: $HEAD_SHA\"\n  mapfile -t files < <(git diff --name-only\
        \ --no-renames \"$BASE_SHA\" \"$HEAD_SHA\")\nelse\n  # On manual runs, default to the full fast-PR bundle.\n\
        \  files=(\"codex-rs/force\" \"tools/argument-comment-lint/force\" \".github/force\")\nfi\n\ncodex=false\n\
        argument_comment_lint=false\nargument_comment_lint_package=false\nworkflows=false\nfor f in \"${files[@]}\"\
        ; do\n  [[ $f == codex-rs/* ]] && codex=true\n  [[ $f == codex-rs/* || $f == tools/argument-comment-lint/*\
        \ || $f == justfile ]] && argument_comment_lint=true\n  [[ $f == defs.bzl || $f == workspace_root_test_launcher.sh.tpl\
        \ || $f == workspace_root_test_launcher.bat.tpl ]] && argument_comment_lint=true\n  [[ $f == tools/argument-comment-lint/*\
        \ || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml ]] && argument_comment_lint_package=true\n\
        \  [[ $f == .github/* ]] && workflows=true\ndone\n\necho \"argument_comment_lint=$argument_comment_lint\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"argument_comment_lint_package=$argument_comment_lint_package\" >> \"$GITHUB_OUTPUT\"\
        \necho \"codex=$codex\" >> \"$GITHUB_OUTPUT\"\necho \"workflows=$workflows\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt
    - name: cargo fmt
      run: cargo fmt -- --config imports_granularity=Item --check
    - name: Rust benchmark smoke test
      run: just bench-smoke
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
    - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
      with:
        tool: cargo-shear@1.11.2
    - name: cargo shear
      run: cargo shear --deny-warnings
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint_package == 'true' }}
    env:
      CARGO_DYLINT_VERSION: 6.1.0
      DYLINT_LINK_VERSION: 6.1.0
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
    - name: Install nightly argument-comment-lint toolchain
      shell: bash
      run: "rustup toolchain install nightly-2026-08-20 \\\n  --profile minimal \\\n  --component llvm-tools-preview\
        \ \\\n  --component rustc-dev \\\n  --component rust-src \\\n  --no-self-update\nrustup default nightly-2026-08-20\n"
    - name: Cache cargo-dylint tooling
      id: cargo_dylint_cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: '~/.cargo/bin/cargo-dylint

          ~/.cargo/bin/dylint-link

          ~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          '
        key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION
          }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain',
          '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
    - name: Install cargo-dylint tooling
      if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: 'cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"

        cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"

        '
    - name: Check Python wrapper syntax
      run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py
        tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
    - name: Test Python wrapper helpers
      run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
    - name: Test argument comment lint package
      working-directory: tools/argument-comment-lint
      run: cargo test
      env:
        RUST_MIN_STACK: '8388608'
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    needs: changed
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          runner: ubuntu-24.04
          timeout_minutes: 180
        - name: macOS
          runner: macos-15
          timeout_minutes: 180
        - name: Windows
          runner: windows-latest
          timeout_minutes: 180
    steps:
    - name: Check whether argument comment lint should run
      id: argument_comment_lint_gate
      shell: bash
      env:
        ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
        WORKFLOWS: ${{ needs.changed.outputs.workflows }}
      run: "if [[ \"$ARGUMENT_COMMENT_LINT\" == \"true\" || \"$WORKFLOWS\" == \"true\" ]]; then\n  echo \"run=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\necho \"No argument-comment-lint relevant changes.\"\necho \"run=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
    - uses: ./.github/actions/setup-bazel-ci
      with:
        target: ${{ runner.os }}
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n  sudo rm -rf /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc\nfi\npython_cmd=python3\nif ! command -v \"$python_cmd\" >/dev/null 2>&1; then python_cmd=python;\
        \ fi\ncpu=\"$(\"$python_cmd\" -c 'import os; print(max(1,min(4,os.cpu_count() or 2)))')\"\nprintf '\\ncommon\
        \ --disk_cache=\\nbuild --jobs=%s\\ntest --local_test_jobs=0\\ntest --default_test_resources=cpu=%s\\n'\
        \ \"$cpu\" \"$cpu\" >> \"$HOME/.bazelrc\"\nprintf 'Fork runner budget: build jobs=%s; tests reserve all\
        \ %s configured CPUs\\n' \"$cpu\" \"$cpu\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\nbazel info\
        \ --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"$(grep -oE -- '--disk_cache=[^[:space:]]*'\
        \ \"$rc_log\" | tail -n 1)\"\n[[ \"$last_cache_option\" == --disk_cache= ]]\n\n\n# Install the fork-only\
        \ launcher after Bazel setup, outside the source checkout.\nexport FORK_BUDGET_CPU=\"$cpu\"\n\"$python_cmd\"\
        \ - <<'FORK_INSTALL_PY'\nimport os,sys,shutil,json\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'fork-bazel-bin'\n\
        root.mkdir(exist_ok=True)\nreal=shutil.which('bazel')\nif not real: raise RuntimeError('Bazel setup did\
        \ not install Bazel')\n(root/'bazel.py').write_text('#!/usr/bin/env python3\\n\"\"\"Fork-only resource limiter;\
        \ preserve upstream options and target boundaries.\"\"\"\\nimport os\\nimport subprocess\\nimport sys\\\
        n\\nargs = sys.argv[1:]\\ncommand = next((a for a in args if not a.startswith(\\'-\\')), \\'\\')\\nif command\
        \ in {\\'build\\', \\'test\\', \\'coverage\\', \\'run\\', \\'aquery\\', \\'cquery\\'}:\\n    budget = int(os.environ[\\\
        'FORK_BAZEL_JOBS\\'])\\n    if not 1 <= budget <= 4:\\n        raise ValueError(f\\'Invalid fork action\
        \ budget: {budget}\\')\\n    pos = args.index(\\'--\\') if \\'--\\' in args else len(args)\\n    args[pos:pos]\
        \ = [f\\'--jobs={budget}\\', f\\'--local_resources=cpu={budget}\\', \\'--local_test_jobs=0\\', f\\'--default_test_resources=cpu={budget}\\\
        ', \\'--announce_rc\\']\\n    print(f\\'Fork Bazel enforced jobs={budget} for {command}\\', file=sys.stderr,\
        \ flush=True)\\nsys.exit(subprocess.run([os.environ[\\'FORK_REAL_BAZEL\\'], *args]).returncode)\\n',encoding='utf-8')\n\
        (root/'bazel').write_text('#!/usr/bin/env bash\\nexec '+__import__('shlex').quote(sys.executable.replace('\\\
        \\','/'))+' '+__import__('shlex').quote(str(root/'bazel.py').replace('\\\\','/'))+' \"$@\"\\n',encoding='utf-8')\n\
        (root/'bazel').chmod(0o755)\nlauncher=root/'bazel'\nif os.name=='nt':\n    import subprocess\n    source=root/'budget.cs'\n\
        \    source.write_text('using System;\\nusing System.Collections.Generic;\\nusing System.Diagnostics;\\\
        nusing System.Text;\\n\\nclass ForkBazelBudget {\\n    // Quote for CreateProcess/CRT argument parsing;\
        \ no command shell is involved.\\n    static string Quote(string value) {\\n        if (value.Length !=\
        \ 0 && value.IndexOfAny(new char[] {\\' \\', \\'\\\\t\\', \\'\\\\n\\', \\'\\\\v\\', \\'\"\\'}) < 0)\\n \
        \           return value;\\n        var result = new StringBuilder(\"\\\\\"\");\\n        int slashes =\
        \ 0;\\n        foreach (char c in value) {\\n            if (c == \\'\\\\\\\\\\') { slashes++; continue;\
        \ }\\n            result.Append(\\'\\\\\\\\\\', c == \\'\"\\' ? slashes * 2 + 1 : slashes);\\n         \
        \   result.Append(c);\\n            slashes = 0;\\n        }\\n        result.Append(\\'\\\\\\\\\\', slashes\
        \ * 2);\\n        result.Append(\\'\"\\');\\n        return result.ToString();\\n    }\\n\\n    static int\
        \ Main(string[] args) {\\n        var forwarded = new List<string>(args);\\n        string command = \"\"\
        ;\\n        foreach (string arg in args) {\\n            if (!arg.StartsWith(\"-\")) { command = arg; break;\
        \ }\\n        }\\n        if (command == \"build\" || command == \"test\" || command == \"coverage\" ||\\\
        n            command == \"run\" || command == \"aquery\" || command == \"cquery\") {\\n            int budget\
        \ = int.Parse(Environment.GetEnvironmentVariable(\"FORK_BAZEL_JOBS\"));\\n            if (budget < 1 ||\
        \ budget > 4) throw new ArgumentOutOfRangeException(\"FORK_BAZEL_JOBS\");\\n            int pos = forwarded.IndexOf(\"\
        --\");\\n            if (pos < 0) pos = forwarded.Count;\\n            forwarded.InsertRange(pos, new string[]\
        \ {\"--jobs=\" + budget,\\n                \"--local_resources=cpu=\" + budget, \"--local_test_jobs=0\"\
        ,\\n                \"--default_test_resources=cpu=\" + budget, \"--announce_rc\"});\\n            Console.Error.WriteLine(\"\
        Fork Bazel enforced jobs=\" + budget + \" for \" + command);\\n        }\\n        var quoted = new List<string>();\\\
        n        foreach (string arg in forwarded) quoted.Add(Quote(arg));\\n        var info = new ProcessStartInfo(Environment.GetEnvironmentVariable(\"\
        FORK_REAL_BAZEL\"),\\n            string.Join(\" \", quoted));\\n        info.UseShellExecute = false;\\\
        n        using (var child = Process.Start(info)) {\\n            child.WaitForExit();\\n            return\
        \ child.ExitCode;\\n        }\\n    }\\n}\\n',encoding='utf-8')\n    compiler=Path(os.environ['WINDIR'])/'Microsoft.NET/Framework64/v4.0.30319/csc.exe'\n\
        \    if not compiler.is_file(): raise RuntimeError('Native .NET Framework C# compiler unavailable')\n  \
        \  launcher=root/'bazel.exe'\n    subprocess.run([str(compiler),'/nologo','/out:'+str(launcher),str(source)],check=True)\n\
        with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:\n    stream.write('FORK_REAL_BAZEL='+real+'\\\
        nFORK_BAZEL_JOBS='+os.environ['FORK_BUDGET_CPU']+'\\nCODEX_BAZEL_BIN='+str(launcher)+'\\n')\nwith open(os.environ['GITHUB_PATH'],'a',encoding='utf-8')\
        \ as stream: stream.write(str(root)+'\\n')\nprint(json.dumps({'real_bazel':real,'launcher':str(launcher),'jobs':os.environ['FORK_BUDGET_CPU']}))\n\
        FORK_INSTALL_PY\n"
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
    - name: Verify native fork budget through upstream Python wrapper
      shell: bash
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
      run: "python - <<'FORK_CONTROL_PY'\n\"\"\"Exercise native subprocess launch through the actual upstream BuildBuddy\
        \ wrapper.\"\"\"\nfrom pathlib import Path\nimport base64,json,os,shlex,subprocess,sys,tempfile\nwith tempfile.TemporaryDirectory(prefix='fork\
        \ budget control ',dir=os.environ.get('RUNNER_TEMP')) as tmp:\n    root=Path(tmp);capture=root/'capture.py';output=root/'captured.json'\n\
        \    capture.write_text(\"import json,os,sys\\nfrom pathlib import Path\\nPath(os.environ['CAPTURE_OUTPUT']).write_text(json.dumps(sys.argv[1:]))\\\
        nsys.exit(int(os.environ.get('CAPTURE_EXIT','0')))\\n\")\n    fake=root/('real-bazel.exe' if os.name=='nt'\
        \ else 'real-bazel')\n    if os.name=='nt':\n        source=root/'capture.cs'\n        source.write_text('using\
        \ System; using System.IO; using System.Text; class Capture { static int Main(string[] args) { File.WriteAllLines(Environment.GetEnvironmentVariable(\"\
        CAPTURE_OUTPUT\"), Array.ConvertAll(args, s => Convert.ToBase64String(Encoding.UTF8.GetBytes(s)))); return\
        \ int.Parse(Environment.GetEnvironmentVariable(\"CAPTURE_EXIT\") ?? \"0\"); } }')\n        compiler=Path(os.environ['WINDIR'])/'Microsoft.NET/Framework64/v4.0.30319/csc.exe'\n\
        \        subprocess.run([str(compiler),'/nologo','/out:'+str(fake),str(source)],check=True)\n    else:\n\
        \        fake.write_text('#!/bin/sh\\nexec '+shlex.quote(sys.executable)+' '+shlex.quote(str(capture))+'\
        \ \"$@\"\\n');fake.chmod(0o755)\n    env=dict(os.environ,FORK_REAL_BAZEL=str(fake),CAPTURE_OUTPUT=str(output),BUILDBUDDY_API_KEY='')\n\
        \    wrapper=Path('.github/scripts/run_bazel_with_buildbuddy.py')\n    commands=[['build','--jobs=8','--','//:local_windows'],['test','--jobs=30','--local_test_jobs=2','--default_test_resources=cpu=1','--test_filter=some\
        \ name','--','//some:target'],['query','--output=label','--','kind(\"rust_library rule\", //...)']]\n  \
        \  commands.append(['build','--jobs=8','--test_env=PATH='+'C:\\\\Program Files\\\\SDK\\\\bin;'*700,'--','//:local_windows'])\n\
        \    commands.append(['test','--test_filter=spaces and \"quotes\" \\\\\\\\ tail\\\\','--','//some:target'])\n\
        \    for command in commands:\n        result=subprocess.run([sys.executable,str(wrapper),*command],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)\n\
        \        if os.environ.get('EXPECTED_CMD_LIMIT_FAILURE')=='1' and sum(map(len,command))>10000:\n       \
        \     if result.returncode==0 or 'The command line is too long' not in result.stdout:raise RuntimeError('CMD\
        \ negative control did not reproduce command-length failure')\n            print('Expected CMD8191-character\
        \ failure verified; no test-pass claim for rejected command')\n            sys.exit(0)\n        print(result.stdout,end='')\n\
        \        if result.returncode:raise RuntimeError(f'Native wrapper failed: {result.returncode}')\n      \
        \  got=[base64.b64decode(line).decode() for line in output.read_text().splitlines()] if os.name=='nt' else\
        \ json.loads(output.read_text());pos=got.index('--')\n        if command[0] in {'build','test'}:\n     \
        \       jobs=[a for a in got[:pos] if a.startswith('--jobs=')]\n            if jobs[-1]!='--jobs='+env['FORK_BAZEL_JOBS']:raise\
        \ ValueError(got)\n            local=[a for a in got[:pos] if a.startswith('--local_test_jobs=')]\n    \
        \        resources=[a for a in got[:pos] if a.startswith('--default_test_resources=cpu=')]\n           \
        \ if local[-1]!='--local_test_jobs=0' or resources[-1]!='--default_test_resources=cpu='+env['FORK_BAZEL_JOBS']:raise\
        \ ValueError(got)\n            if got[pos:]!=command[command.index('--'):]:raise ValueError(got)\n     \
        \   elif any(a.startswith('--jobs=') for a in got):raise ValueError(got)\n        for original in command[1:command.index('--')]:\n\
        \            if original not in got:raise ValueError('Argument changed through native launcher')\n     \
        \   print(json.dumps({'platform':sys.platform,'command':command[0],'argument_count':len(got),'characters':sum(map(len,got)),'arguments_preserved':True}))\n\
        \    env['CAPTURE_EXIT']='37'\n    result=subprocess.run([sys.executable,str(wrapper),'build','--jobs=8','--','//:local_windows'],env=env)\n\
        \    if result.returncode!=37:raise ValueError(f'Child exit status changed: {result.returncode}')\nprint('Native\
        \ wrapper budget controls passed')\n\nFORK_CONTROL_PY\n"
    - name: Install Linux sandbox build dependencies
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' && (runner.os == 'Linux') }}
      shell: bash
      run: 'sudo DEBIAN_FRONTEND=noninteractive apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

        '
    - name: Run argument comment lint on codex-rs via Bazel
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' && (runner.os != 'Windows') }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "bazel_targets=\"$(./tools/argument-comment-lint/list-bazel-targets.sh)\"\n./.github/scripts/run-bazel-ci.sh\
        \ \\\n  -- \\\n  build \\\n  --config=argument-comment-lint \\\n  --keep_going \\\n  --build_metadata=COMMIT_SHA=${GITHUB_SHA}\
        \ \\\n  -- \\\n  ${bazel_targets}\n"
    - name: Run argument comment lint on codex-rs via Bazel
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' && (runner.os == 'Windows') }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "./.github/scripts/run-argument-comment-lint-bazel.sh \\\n  --config=argument-comment-lint \\\n  --platforms=//:local_windows\
        \ \\\n  --keep_going \\\n  --build_metadata=COMMIT_SHA=${GITHUB_SHA}\n"
    - name: Check for a clean worktree
      if: always() && !cancelled() && steps.argument_comment_lint_gate.outputs.run == 'true'
      uses: ./.github/actions/check-clean-worktree
  results:
    name: CI results (required)
    needs:
    - changed
    - general
    - cargo_shear
    - argument_comment_lint_package
    - argument_comment_lint_prebuilt
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Summarize
      shell: bash
      run: "echo \"argpkg : ${{ needs.argument_comment_lint_package.result }}\"\necho \"arglint: ${{ needs.argument_comment_lint_prebuilt.result\
        \ }}\"\necho \"general: ${{ needs.general.result }}\"\necho \"shear  : ${{ needs.cargo_shear.result }}\"\
        \n\n# If nothing relevant changed (PR touching only root README, etc.),\n# declare success regardless of\
        \ other jobs.\nif [[ \"${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}\" != 'true' && \"${NEEDS_CHANGED_OUTPUTS_CODEX}\"\
        \ != 'true' && \"${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}\" != 'true' ]]; then\n  echo 'No relevant changes ->\
        \ CI not required.'\n  exit 0\nfi\n\nif [[ \"${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}\" ==\
        \ 'true' ]]; then\n  [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package\
        \ failed'; exit 1; }\nfi\n\nif [[ \"${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}\" == 'true' || \"${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}\"\
        \ == 'true' ]]; then\n  [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo\
        \ 'argument_comment_lint_prebuilt failed'; exit 1; }\nfi\n\nif [[ \"${NEEDS_CHANGED_OUTPUTS_CODEX}\" ==\
        \ 'true' || \"${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}\" == 'true' ]]; then\n  [[ '${{ needs.general.result }}'\
        \ == 'success' ]] || { echo 'general failed'; exit 1; }\n  [[ '${{ needs.cargo_shear.result }}' == 'success'\
        \ ]] || { echo 'cargo_shear failed'; exit 1; }\nfi\n"
      env:
        NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
        NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
        NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
        NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE: ${{ needs.changed.outputs.argument_comment_lint_package
          }}
