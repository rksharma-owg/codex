name: Fork preflight - rust-ci
on:
  workflow_call:
    inputs:
      target-sha:
        type: string
        required: true
      patch-sha:
        type: string
        required: true
      base-sha:
        type: string
        required: true
      issue:
        type: string
        required: true
jobs:
  changed:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      argument_comment_lint: ${{ steps.detect.outputs.argument_comment_lint }}
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Detect changed paths (no external action)
      id: detect
      shell: bash
      run: "set -euo pipefail\n\nif true; then\n  BASE_SHA='${{ inputs.base-sha }}'\n  HEAD_SHA='${{ inputs.target-sha }}'\n\
        \  echo \"Base SHA: $BASE_SHA\"\n  echo \"Head SHA: $HEAD_SHA\"\n  mapfile -t files < <(git diff --name-only --no-renames\
        \ \"$BASE_SHA\" \"$HEAD_SHA\")\nelse\n  # On manual runs, default to the full fast-PR bundle.\n  files=(\"codex-rs/force\"\
        \ \"tools/argument-comment-lint/force\" \".github/force\")\nfi\n\ncodex=false\nargument_comment_lint=false\nargument_comment_lint_package=false\n\
        workflows=false\nfor f in \"${files[@]}\"; do\n  [[ $f == codex-rs/* ]] && codex=true\n  [[ $f == codex-rs/* || $f\
        \ == tools/argument-comment-lint/* || $f == justfile ]] && argument_comment_lint=true\n  [[ $f == defs.bzl || $f ==\
        \ workspace_root_test_launcher.sh.tpl || $f == workspace_root_test_launcher.bat.tpl ]] && argument_comment_lint=true\n\
        \  [[ $f == tools/argument-comment-lint/* || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml\
        \ ]] && argument_comment_lint_package=true\n  [[ $f == .github/* ]] && workflows=true\ndone\n\necho \"argument_comment_lint=$argument_comment_lint\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"argument_comment_lint_package=$argument_comment_lint_package\" >> \"$GITHUB_OUTPUT\"\
        \necho \"codex=$codex\" >> \"$GITHUB_OUTPUT\"\necho \"workflows=$workflows\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt
    - name: cargo fmt
      run: cargo fmt -- --config imports_granularity=Item --check
    - name: Rust benchmark smoke test
      run: just bench-smoke
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
    - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
      with:
        tool: cargo-shear@1.11.2
    - name: cargo shear
      run: cargo shear --deny-warnings
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint_package == 'true' }}
    env:
      CARGO_DYLINT_VERSION: 6.1.0
      DYLINT_LINK_VERSION: 6.1.0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
    - name: Install nightly argument-comment-lint toolchain
      shell: bash
      run: "rustup toolchain install nightly-2026-08-20 \\\n  --profile minimal \\\n  --component llvm-tools-preview \\\n\
        \  --component rustc-dev \\\n  --component rust-src \\\n  --no-self-update\nrustup default nightly-2026-08-20\n"
    - name: Cache cargo-dylint tooling
      id: cargo_dylint_cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: '~/.cargo/bin/cargo-dylint

          ~/.cargo/bin/dylint-link

          ~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          '
        key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock',
          'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml')
          }}
    - name: Install cargo-dylint tooling
      if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: 'cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"

        cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"

        '
    - name: Check Python wrapper syntax
      run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py
        tools/argument-comment-lint/test_wrapper_common.py
    - name: Test Python wrapper helpers
      run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
    - name: Test argument comment lint package
      working-directory: tools/argument-comment-lint
      run: cargo test
      env:
        RUST_MIN_STACK: '8388608'
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: changed
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          runner: ubuntu-24.04
          timeout_minutes: 60
        - name: macOS
          runner: macos-15
          timeout_minutes: 60
        - name: Windows
          runner: windows-latest
          timeout_minutes: 60
    steps:
    - name: Check whether argument comment lint should run
      id: argument_comment_lint_gate
      shell: bash
      env:
        ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
        WORKFLOWS: ${{ needs.changed.outputs.workflows }}
      run: "if [[ \"$ARGUMENT_COMMENT_LINT\" == \"true\" || \"$WORKFLOWS\" == \"true\" ]]; then\n  echo \"run=true\" >> \"\
        $GITHUB_OUTPUT\"\n  exit 0\nfi\n\necho \"No argument-comment-lint relevant changes.\"\necho \"run=false\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
    - name: Run argument comment lint on codex-rs via Bazel
      if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
      uses: ./.github/actions/run-argument-comment-lint
      with:
        target: ${{ runner.os }}
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
    - name: Check for a clean worktree
      if: always() && !cancelled() && steps.argument_comment_lint_gate.outputs.run == 'true'
      uses: ./.github/actions/check-clean-worktree
  results:
    name: CI results (required)
    needs:
    - changed
    - general
    - cargo_shear
    - argument_comment_lint_package
    - argument_comment_lint_prebuilt
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Summarize
      shell: bash
      run: "echo \"argpkg : ${{ needs.argument_comment_lint_package.result }}\"\necho \"arglint: ${{ needs.argument_comment_lint_prebuilt.result\
        \ }}\"\necho \"general: ${{ needs.general.result }}\"\necho \"shear  : ${{ needs.cargo_shear.result }}\"\n\n# If nothing\
        \ relevant changed (PR touching only root README, etc.),\n# declare success regardless of other jobs.\nif [[ \"${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}\"\
        \ != 'true' && \"${NEEDS_CHANGED_OUTPUTS_CODEX}\" != 'true' && \"${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}\" != 'true' ]];\
        \ then\n  echo 'No relevant changes -> CI not required.'\n  exit 0\nfi\n\nif [[ \"${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}\"\
        \ == 'true' ]]; then\n  [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package\
        \ failed'; exit 1; }\nfi\n\nif [[ \"${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}\" == 'true' || \"${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}\"\
        \ == 'true' ]]; then\n  [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo 'argument_comment_lint_prebuilt\
        \ failed'; exit 1; }\nfi\n\nif [[ \"${NEEDS_CHANGED_OUTPUTS_CODEX}\" == 'true' || \"${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}\"\
        \ == 'true' ]]; then\n  [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }\n \
        \ [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }\nfi\n"
      env:
        NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
        NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
        NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
        NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE: ${{ needs.changed.outputs.argument_comment_lint_package }}
