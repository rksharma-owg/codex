name: Fork preflight - blob-size-policy
on:
  workflow_call:
    inputs:
      target-sha:
        type: string
        required: true
      patch-sha:
        type: string
        required: true
      base-sha:
        type: string
        required: true
      issue:
        type: string
        required: true
jobs:
  check:
    name: Blob size policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63
      with:
        mode: audit
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Determine comparison range
      id: range
      shell: bash
      run: 'echo "base=${{ inputs.base-sha }}" >> "$GITHUB_OUTPUT"

        echo "head=${{ inputs.target-sha }}" >> "$GITHUB_OUTPUT"

        '
    - name: Check changed blob sizes
      env:
        BASE_SHA: ${{ steps.range.outputs.base }}
        HEAD_SHA: ${{ steps.range.outputs.head }}
      run: "python3 scripts/check_blob_size.py \\\n  --base \"$BASE_SHA\" \\\n  --head \"$HEAD_SHA\" \\\n  --max-bytes 512000\
        \ \\\n  --allowlist .github/blob-size-allowlist.txt\n"
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
