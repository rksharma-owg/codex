name: All three patches - Rust 1.95 repaired baseline
'on':
  push:
    branches:
    - codex/full-validation-20261015
permissions:
  contents: read
jobs:
  focused:
    name: ${{ matrix.patch.issue }} Rust 1.95 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-latest
        patch:
        - issue: '48124'
          branch: fix/reject-invalid-codex-home
          package: codex-utils-home-dir
          head: d8ff80f3301548f06bd128722e97a5a926446bca
          base: 6f3af8adfb5b7e11a961abb250fd58b1685ee1fb
          merge: d9af1eb49f45512abd50b82ec70fdf6a034510e6
          validation_branch: codex/validate-48124-ci-repaired
          upstream: bb64b894fd67158be0f874872e6d7bfe717e7368
        - issue: '53935'
          branch: fix/recover-missing-daemon-selection
          package: codex-app-server-daemon
          head: 18bb0ac24b18883cd95fc69bd8f1786672b1414b
          base: 6f3af8adfb5b7e11a961abb250fd58b1685ee1fb
          merge: 2f66d6e887a5c54e3b9386e2cbfbc90d13eb5554
          validation_branch: codex/validate-53935-ci-repaired
          upstream: bb64b894fd67158be0f874872e6d7bfe717e7368
        - issue: '54016'
          branch: fix/resume-settled-error-overrides
          package: codex-app-server
          head: c66117aab2feb4465ac3dbef14254ed16f0a4334
          base: 6f3af8adfb5b7e11a961abb250fd58b1685ee1fb
          merge: 1d7f329e394a469b0f21e997358da347116fc4cc
          validation_branch: codex/validate-54016-ci-repaired
          upstream: bb64b894fd67158be0f874872e6d7bfe717e7368
    env:
      RUST_MIN_STACK: '8388608'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: codex-rs
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.patch.merge }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify tested code
      shell: bash
      env:
        PATCH: ${{ matrix.patch.head }}
        TESTED: ${{ matrix.patch.merge }}
        BASE: ${{ matrix.patch.base }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED" ]]

        git merge-base --is-ancestor "$PATCH" HEAD

        git merge-base --is-ancestor "$BASE" HEAD

        printf "tested=%s\npatch=%s\nbase=%s\n" "$TESTED" "$PATCH" "$BASE"

        printf "workflow=%s\n" "${{ github.workflow_sha }}"

        '
    - uses: ./.github/actions/setup-ci
    - name: Install pinned Rust
      uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt,clippy,rust-src
    - name: Verify pinned Rust version
      shell: bash
      run: 'rustc --version --verbose

        cargo --version

        rustc --version | grep -F "rustc 1.95.0 "'
    - name: Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev
    - name: Formatting
      run: cargo fmt -- --config imports_granularity=Item --check
    - name: Regression and crate tests
      shell: bash
      env:
        ISSUE: ${{ matrix.patch.issue }}
        PACKAGE: ${{ matrix.patch.package }}
      run: "set -euo pipefail\nif [[ \"$ISSUE\" == 54016 ]]; then\n  cargo test --locked\
        \ -p \"$PACKAGE\" --test resume_system_error\nelif [[ \"$ISSUE\" == 53935\
        \ ]]; then\n  cargo test --locked -p \"$PACKAGE\" --lib\nelse\n  cargo test\
        \ --locked -p \"$PACKAGE\"\nfi\n"
    - name: Clippy including tests
      if: always() && !cancelled()
      run: cargo clippy --locked -p ${{ matrix.patch.package }} --tests -- -D warnings
    - name: Clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
