        \\\"%workspace_root_marker_dir%..\\\\\\\\..\\\\\") do set \\\\\"workspace_root=%%~fI\\\\\"\\\\n\\\\ncall\
        \ :resolve_runfile \\\\\"__TEST_BIN__\\\\\"\\\\nif errorlevel 1 exit /b 1\\\\nset \\\\\"test_bin=!resolve_runfile_result!\\\
        \\\"\\\\n\\\\n__RUNFILE_ENV_EXPORTS__\\\\n\\\\nif not defined test_bin (\\\\n  >&2 echo resolved test binary\
