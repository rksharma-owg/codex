        \ { $hash = [uint32](([uint64]($hash -bxor $byte) * $fnvPrime) -band $u32Mask) }; if (($hash %% $totalShards)\
        \ -eq $shardIndex) { $test } } else { $test } }\\\\\" ^\\\\n  > \\\\\"!TEMP_SHARD_LIST!\\\\\"\\\\nif errorlevel\
        \ 1 (\\\\n  rmdir /s /q \\\\\"!TEMP_DIR!\\\\\" 2>nul\\\\n  exit /b 1\\\\n)\\\\n\\\\npowershell.exe -NoProfile\
