        \ not defined TEMP_ROOT set \\\\\"TEMP_ROOT=%TEMP%\\\\\"\\\\nif not defined TEMP_ROOT set \\\\\"TEMP_ROOT=.\\\
        \\\"\\\\n:CREATE_TEMP_DIR\\\\nset \\\\\"TEMP_DIR=%TEMP_ROOT%\\\\\\\\workspace_root_test_sharding_!RANDOM!_!RANDOM!_!RANDOM!\\\
        \\\"\\\\nmkdir \\\\\"!TEMP_DIR!\\\\\" 2>nul\\\\nif errorlevel 1 goto :CREATE_TEMP_DIR\\\\nset \\\\\"TEMP_LIST=!TEMP_DIR!\\\
        \\\\\\list.txt\\\\\"\\\\nset \\\\\"TEMP_SHARD_LIST=!TEMP_DIR!\\\\\\\\shard.txt\\\\\"\\\\n\\\\n\\\\\"%test_bin%\\\
        \\\" --list --format terse > \\\\\"!TEMP_LIST!\\\\\"\\\\nif errorlevel 1 (\\\\n  rmdir /s /q \\\\\"!TEMP_DIR!\\\
        \\\" 2>nul\\\\n  exit /b 1\\\\n)\\\\n\\\\npowershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^\\\
        \\n  \\\\\"$ErrorActionPreference = \\'Stop\\';\\\\\" ^\\\\n  \\\\\"$tests = @(Get-Content -LiteralPath\
        \ $env:TEMP_LIST | Where-Object { $_.EndsWith(\\': test\\') } | ForEach-Object { $_.Substring(0, $_.Length\
        \ - 6) });\\\\\" ^\\\\n  \\\\\"[Array]::Sort($tests, [StringComparer]::Ordinal);\\\\\" ^\\\\n  \\\\\"$hasShards\
        \ = -not [string]::IsNullOrEmpty($env:HAS_SHARDS);\\\\\" ^\\\\n  \\\\\"$skipFilters = @();\\\\\" ^\\\\n\
        \  \\\\\"if (-not [string]::IsNullOrEmpty($env:CODEX_BAZEL_TEST_SKIP_FILTERS)) { $skipFilters = @($env:CODEX_BAZEL_TEST_SKIP_FILTERS\
        \ -split \\',\\' | Where-Object { $_ -ne \\'\\' }) };\\\\\" ^\\\\n  \\\\\"if ($hasShards) { $totalShards\
        \ = [uint32]$env:TOTAL_SHARDS; $shardIndex = [uint32]$env:SHARD_INDEX };\\\\\" ^\\\\n  \\\\\"$fnvPrime =\
        \ [uint64]16777619; $u32Mask = [uint64]4294967295;\\\\\" ^\\\\n  \\\\\"foreach ($test in $tests) { $skip\
