    if: always()
    needs: test-windows-shard
    runs-on: ubuntu-24.04
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm
    steps:
    - name: Confirm Windows Bazel test shards passed
      shell: bash
      run: "if [[ \"${{ needs.test-windows-shard.result }}\" != \"success\" ]]; then\n  echo \"Windows Bazel test\
        \ shards finished with result: ${{ needs.test-windows-shard.result }}\" >&2\n  exit 1\nfi\n"
  clippy:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - os: macos-15
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
