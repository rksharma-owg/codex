    - name: bazel test shard
      env:
        BAZEL_TEST_SHARD: ${{ matrix.shard }}
        BAZEL_TEST_SHARD_COUNT: 4
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "set -euo pipefail\n\nbazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags,\
        \ \"manual\", tests(//...))'\nbazel_targets_file=\"$(mktemp)\"\nselected_targets_file=\"$(mktemp)\"\ntrap\
        \ 'rm -f \"${bazel_targets_file}\" \"${selected_targets_file}\"' EXIT\n\n# Keep query and selection in the\
        \ foreground so failures cannot leave\n# different jobs assigning different partial target lists.\n./.github/scripts/run-bazel-query-ci.sh\
        \ --output=label -- \"${bazel_test_query}\" \\\n  | LC_ALL=C sort > \"${bazel_targets_file}\"\npython .github/scripts/select_windows_bazel_targets.py\
        \ \\\n  --shard \"${BAZEL_TEST_SHARD}\" \\\n  --shard-count \"${BAZEL_TEST_SHARD_COUNT}\" \\\n  < \"${bazel_targets_file}\"\
        \ > \"${selected_targets_file}\"\nmapfile -t selected_targets < \"${selected_targets_file}\"\n\nbazel_test_args=(\n\
        \  test\n  --skip_incompatible_explicit_targets\n  --test_tag_filters=-argument-comment-lint\n  --test_verbose_timeout_warnings\n\
        \  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }}\n  --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}\n\
        )\n\n./.github/scripts/run-bazel-ci.sh \\\n  --print-failed-action-summary \\\n  --print-failed-test-logs\
        \ \\\n  --windows-cross-compile \\\n  --remote-download-toplevel \\\n  -- \\\n  \"${bazel_test_args[@]}\"\
        \ \\\n  -- \\\n  \"${selected_targets[@]}\"\n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-test-x86_64-pc-windows-gnullvm-shard-${{ matrix.shard }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
