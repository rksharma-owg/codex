        \ budget control ',dir=os.environ.get('RUNNER_TEMP')) as tmp:\n    root=Path(tmp);capture=root/'capture.py';output=root/'captured.json'\n\
        \    capture.write_text(\"import json,os,sys\\nfrom pathlib import Path\\nPath(os.environ['CAPTURE_OUTPUT']).write_text(json.dumps(sys.argv[1:]))\\\
        nsys.exit(int(os.environ.get('CAPTURE_EXIT','0')))\\n\")\n    fake=root/('real-bazel.exe' if os.name=='nt'\
        \ else 'real-bazel')\n    if os.name=='nt':\n        source=root/'capture.cs'\n        source.write_text('using\
        \ System; using System.IO; using System.Text; class Capture { static int Main(string[] args) { File.WriteAllLines(Environment.GetEnvironmentVariable(\"\
        CAPTURE_OUTPUT\"), Array.ConvertAll(args, s => Convert.ToBase64String(Encoding.UTF8.GetBytes(s)))); return\
        \ int.Parse(Environment.GetEnvironmentVariable(\"CAPTURE_EXIT\") ?? \"0\"); } }')\n        compiler=Path(os.environ['WINDIR'])/'Microsoft.NET/Framework64/v4.0.30319/csc.exe'\n\
        \        subprocess.run([str(compiler),'/nologo','/out:'+str(fake),str(source)],check=True)\n    else:\n\
        \        fake.write_text('#!/bin/sh\\nexec '+shlex.quote(sys.executable)+' '+shlex.quote(str(capture))+'\
        \ \"$@\"\\n');fake.chmod(0o755)\n    env=dict(os.environ,FORK_REAL_BAZEL=str(fake),CAPTURE_OUTPUT=str(output),BUILDBUDDY_API_KEY='')\n\
        \    wrapper=Path('.github/scripts/run_bazel_with_buildbuddy.py')\n    commands=[['build','--jobs=8','--','//:local_windows'],['test','--jobs=30','--test_filter=some\
        \ name','--','//some:target'],['query','--output=label','--','kind(\"rust_library rule\", //...)']]\n  \
        \  commands.append(['build','--jobs=8','--test_env=PATH='+'C:\\\\Program Files\\\\SDK\\\\bin;'*700,'--','//:local_windows'])\n\
        \    commands.append(['test','--test_filter=spaces and \"quotes\" \\\\\\\\ tail\\\\','--','//some:target'])\n\
        \    for command in commands:\n        result=subprocess.run([sys.executable,str(wrapper),*command],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)\n\
        \        if os.environ.get('EXPECTED_CMD_LIMIT_FAILURE')=='1' and sum(map(len,command))>10000:\n       \
        \     if result.returncode==0 or 'The command line is too long' not in result.stdout:raise RuntimeError('CMD\
        \ negative control did not reproduce command-length failure')\n            print('Expected CMD8191-character\
        \ failure verified; no test-pass claim for rejected command')\n            sys.exit(0)\n        print(result.stdout,end='')\n\
        \        if result.returncode:raise RuntimeError(f'Native wrapper failed: {result.returncode}')\n      \
        \  got=[base64.b64decode(line).decode() for line in output.read_text().splitlines()] if os.name=='nt' else\
        \ json.loads(output.read_text());pos=got.index('--')\n        if command[0] in {'build','test'}:\n     \
        \       jobs=[a for a in got[:pos] if a.startswith('--jobs=')]\n            if jobs[-1]!='--jobs='+env['FORK_BAZEL_JOBS']:raise\
        \ ValueError(got)\n            if got[pos:]!=command[command.index('--'):]:raise ValueError(got)\n     \
        \   elif any(a.startswith('--jobs=') for a in got):raise ValueError(got)\n        for original in command[1:command.index('--')]:\n\
        \            if original not in got:raise ValueError('Argument changed through native launcher')\n     \
        \   print(json.dumps({'platform':sys.platform,'command':command[0],'argument_count':len(got),'characters':sum(map(len,got)),'arguments_preserved':True}))\n\
        \    env['CAPTURE_EXIT']='37'\n    result=subprocess.run([sys.executable,str(wrapper),'build','--jobs=8','--','//:local_windows'],env=env)\n\
        \    if result.returncode!=37:raise ValueError(f'Child exit status changed: {result.returncode}')\nprint('Native\
        \ wrapper budget controls passed')\n\nFORK_CONTROL_PY\n"
    - name: bazel build verify-release-build targets
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "# This job exists to compile Rust code behind\n# `cfg(not(debug_assertions))` so PR CI catches failures\
        \ that would\n# otherwise show up only in a release build. We do not need the full\n# optimizer and debug-info\
        \ work that normally comes with a release\n# build to get that signal, so keep Bazel in `fastbuild` and\
        \ disable\n# Rust debug assertions explicitly.\nbazel_wrapper_args=()\nif [[ \"${RUNNER_OS}\" == \"Windows\"\
        \ ]]; then\n  # This is build-only signal, so use the same Linux-RBE\n  # cross-compile path as the fast\
        \ Windows test and clippy jobs.\n  # Fork/community PRs without the BuildBuddy secret fall back\n  # inside\
        \ `run-bazel-ci.sh` to the previous local Windows MSVC\n  # host-platform shape.\n  bazel_wrapper_args+=(--windows-cross-compile)\n\
        fi\n\nbazel_build_args=(\n  --compilation_mode=fastbuild\n  --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no\n\
        \  --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no\n  --build_metadata=COMMIT_SHA=${{\
        \ inputs.target-sha }}\n  --build_metadata=TAG_job=verify-release-build\n  --build_metadata=TAG_rust_debug_assertions=off\n\
        )\n\nbazel_target_lines=\"$(bash ./scripts/list-bazel-release-targets.sh)\"\nbazel_targets=()\nwhile IFS=\
        \ read -r target; do\n  bazel_targets+=(\"${target}\")\ndone <<< \"${bazel_target_lines}\"\n\n./.github/scripts/run-bazel-ci.sh\
        \ \\\n  \"${bazel_wrapper_args[@]}\" \\\n  -- \\\n  build \\\n  \"${bazel_build_args[@]}\" \\\n  -- \\\n\
        \  \"${bazel_targets[@]}\"\n"
    - name: Verify Bazel builds bwrap
      if: runner.os == 'Linux'
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "./.github/scripts/run-bazel-ci.sh \\\n  --remote-download-toplevel \\\n  --print-failed-action-summary\
        \ \\\n  -- \\\n  build \\\n  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }} \\\n  --build_metadata=TAG_job=verify-bwrap\
        \ \\\n  -- \\\n  //codex-rs/bwrap:bwrap\n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-verify-release-build-${{ matrix.target }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  partition-coverage:
    name: Complete Linux build/test target coverage
    if: always() && !cancelled()
    needs:
    - test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ${{ inputs.issue }}-target-roots-*
        merge-multiple: true
        path: ${{ runner.temp }}/target-manifests
    - name: Require every root once in each Linux matrix entry
      shell: bash
      env:
        ISSUE: ${{ inputs.issue }}
        TESTED_SHA: ${{ inputs.target-sha }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        MANIFEST_DIR: ${{ runner.temp }}/target-manifests
      run: "python3 - <<'PY'\nfrom pathlib import Path\nfrom collections import Counter,defaultdict\nimport hashlib,json,os\n\
        \ndef require(ok,message):\n    if not ok:\n        raise ValueError(message)\n\nfiles=list(Path(os.environ['MANIFEST_DIR']).rglob('*.json'))\n\
        require(len(files)==8,f'Expected 8 Linux partition manifests, got {len(files)}')\ngroups=defaultdict(list)\n\
        for file in files:\n    x=json.loads(file.read_text())\n    require(x['issue']==os.environ['ISSUE'],'Wrong\
        \ issue')\n    require(x['tested_sha']==os.environ['TESTED_SHA'],'Wrong tested SHA')\n    require(x['workflow_sha']==os.environ['WORKFLOW_SHA'],'Wrong\
        \ workflow SHA')\n    require(x['partition_count']==4,'Wrong partition count')\n    groups[x['target']].append(x)\n\
        require(set(groups)=={'x86_64-unknown-linux-gnu','x86_64-unknown-linux-musl'},'Missing or unexpected Linux\
        \ matrix entry')\nfor target,items in groups.items():\n    require(sorted(x['partition'] for x in items)==[1,2,3,4],'Missing\
        \ or duplicate partition index')\n    roots=items[0]['all_roots']\n    require(bool(roots) and roots==sorted(set(roots)),'Empty,\
        \ duplicate or unsorted complete target set')\n    digest=hashlib.sha256('\\n'.join(roots).encode()).hexdigest()\n\
        \    require(all(x['all_roots']==roots and x['roots_sha256']==digest for x in items),'Partition target sets\
        \ differ or hashes are invalid')\n    counts=Counter(label for x in items for label in x['selected_roots'])\n\
        \    require(set(counts)==set(roots) and all(n==1 for n in counts.values()),'Omitted or duplicated build/test\
        \ root: '+target)\n    print(f'{target}: {len(roots)} build/test roots covered exactly once across four\
        \ partitions')\n\nPY\n"
