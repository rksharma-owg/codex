        \ wrapper budget controls passed')\n\nFORK_CONTROL_PY\n"
    - name: bazel build --config=clippy lint targets
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "bazel_clippy_args=(\n  --config=clippy\n  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }}\n  --build_metadata=TAG_job=clippy\n\
        )\nbazel_wrapper_args=()\nbazel_target_list_args=()\nif [[ \"${RUNNER_OS}\" == \"Windows\" ]]; then\n  #\
        \ Keep this aligned with the fast Windows Bazel test job: use\n  # Linux RBE for clippy build actions while\
        \ targeting Windows\n  # gnullvm. Fork/community PRs without the BuildBuddy secret fall\n  # back inside\
        \ `run-bazel-ci.sh` to the previous local Windows MSVC\n  # host-platform shape.\n  bazel_wrapper_args+=(--windows-cross-compile)\n\
        \  bazel_target_list_args+=(--windows-cross-compile)\n  if [[ -z \"${BUILDBUDDY_API_KEY:-}\" ]]; then\n\
        \    # The fork fallback can see incompatible explicit Windows-cross\n    # internal test binaries in the\
        \ generated target list. Preserve\n    # the old local-fallback behavior there.\n    bazel_clippy_args+=(--skip_incompatible_explicit_targets)\n\
        \  fi\nfi\n\nbazel_target_lines=\"$(./scripts/list-bazel-clippy-targets.sh \"${bazel_target_list_args[@]}\"\
        )\"\nbazel_targets=()\nwhile IFS= read -r target; do\n  bazel_targets+=(\"${target}\")\ndone <<< \"${bazel_target_lines}\"\
        \n\n./.github/scripts/run-bazel-ci.sh \\\n  --print-failed-action-summary \\\n  \"${bazel_wrapper_args[@]}\"\
        \ \\\n  -- \\\n  build \\\n  \"${bazel_clippy_args[@]}\" \\\n  -- \\\n  \"${bazel_targets[@]}\"\n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-clippy-${{ matrix.target }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
