name: Fork preflight - bazel
'on':
  workflow_call:
    inputs:
      target-sha:
        type: string
        required: true
      patch-sha:
        type: string
        required: true
      base-sha:
        type: string
        required: true
      issue:
        type: string
        required: true
concurrency:
  group: fork-preflight-${{ inputs.issue }}-${{ inputs.target-sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          target: aarch64-apple-darwin
        - os: macos-15-intel
          target: x86_64-apple-darwin
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Prepare Bazel CI
      id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.target }}
        cache-scope: bazel-${{ github.job }}
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\n# Reclaim optional preinstalled SDKs that this Rust/Python/Node matrix does not use.\n# This\
        \ runs only on the disposable hosted runner, outside the source checkout.\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n\
        \  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc\nfi\n# Upstream remote CI also disables the duplicate\
        \ local action cache.\nprintf '\\ncommon --disk_cache=\\n' >> \"$HOME/.bazelrc\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\
        \nbazel info --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"$(grep -oE -- '--disk_cache=[^[:space:]]*'\
        \ \"$rc_log\" | tail -n 1)\"\n[[ \"$last_cache_option\" == --disk_cache= ]]\n"
    - name: Check rusty_v8 MODULE.bazel checksums
      if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
      shell: bash
      run: 'python3 .github/scripts/rusty_v8_bazel.py check-module-bazel

        just test-github-scripts

        '
    - name: Check MODULE.bazel.lock is up to date
      if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
      shell: bash
      run: ./scripts/check-module-bazel-lock.sh
    - name: bazel test //...
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "bazel_targets=(\n  //...\n  # Keep standalone V8 library targets out of the ordinary Bazel CI\n  # path. V8 consumers\
        \ under `//codex-rs/...` still participate\n  # transitively through `//...`.\n  -//third_party/v8:all\n  -//codex-rs/v8-poc:v8-poc-unit-tests\n\
        )\n\nbazel_wrapper_args=(\n  --print-failed-action-summary\n  --print-failed-test-logs\n)\nbazel_test_args=(\n  test\n\
        \  --test_tag_filters=-argument-comment-lint\n  --test_verbose_timeout_warnings\n  --build_metadata=COMMIT_SHA=${{\
        \ inputs.target-sha }}\n)\n./.github/scripts/run-bazel-ci.sh \\\n  \"${bazel_wrapper_args[@]}\" \\\n  -- \\\n  \"\
        ${bazel_test_args[@]}\" \\\n  -- \\\n  \"${bazel_targets[@]}\"\n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-test-${{ matrix.target }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  test-windows-shard:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    runs-on: windows-latest
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm shard ${{ matrix.shard }}/4
    environment:
      name: bazel
      deployment: false
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Test BuildBuddy Bazel wrapper
      if: matrix.shard == 1
      shell: pwsh
      run: python .github/scripts/test_run_bazel_with_buildbuddy.py
    - name: Test Windows Bazel target selector
      if: matrix.shard == 1
      shell: pwsh
      run: python -m unittest discover -s .github/scripts -p test_select_windows_bazel_targets.py
    - name: Prepare Bazel CI
      id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: x86_64-pc-windows-gnullvm
        cache-scope: bazel-test
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\n# Reclaim optional preinstalled SDKs that this Rust/Python/Node matrix does not use.\n# This\
        \ runs only on the disposable hosted runner, outside the source checkout.\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n\
        \  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc\nfi\n# Upstream remote CI also disables the duplicate\
        \ local action cache.\nprintf '\\ncommon --disk_cache=\\n' >> \"$HOME/.bazelrc\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\
        \nbazel info --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"$(grep -oE -- '--disk_cache=[^[:space:]]*'\
        \ \"$rc_log\" | tail -n 1)\"\n[[ \"$last_cache_option\" == --disk_cache= ]]\n"
    - name: bazel test shard
      env:
        BAZEL_TEST_SHARD: ${{ matrix.shard }}
        BAZEL_TEST_SHARD_COUNT: 4
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "set -euo pipefail\n\nbazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, \"manual\"\
        , tests(//...))'\nbazel_targets_file=\"$(mktemp)\"\nselected_targets_file=\"$(mktemp)\"\ntrap 'rm -f \"${bazel_targets_file}\"\
        \ \"${selected_targets_file}\"' EXIT\n\n# Keep query and selection in the foreground so failures cannot leave\n# different\
        \ jobs assigning different partial target lists.\n./.github/scripts/run-bazel-query-ci.sh --output=label -- \"${bazel_test_query}\"\
        \ \\\n  | LC_ALL=C sort > \"${bazel_targets_file}\"\npython .github/scripts/select_windows_bazel_targets.py \\\n \
        \ --shard \"${BAZEL_TEST_SHARD}\" \\\n  --shard-count \"${BAZEL_TEST_SHARD_COUNT}\" \\\n  < \"${bazel_targets_file}\"\
        \ > \"${selected_targets_file}\"\nmapfile -t selected_targets < \"${selected_targets_file}\"\n\nbazel_test_args=(\n\
        \  test\n  --skip_incompatible_explicit_targets\n  --test_tag_filters=-argument-comment-lint\n  --test_verbose_timeout_warnings\n\
        \  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }}\n  --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}\n\
        )\n\n./.github/scripts/run-bazel-ci.sh \\\n  --print-failed-action-summary \\\n  --print-failed-test-logs \\\n  --windows-cross-compile\
        \ \\\n  --remote-download-toplevel \\\n  -- \\\n  \"${bazel_test_args[@]}\" \\\n  -- \\\n  \"${selected_targets[@]}\"\
        \n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-test-x86_64-pc-windows-gnullvm-shard-${{ matrix.shard }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  test-windows:
    if: always()
    needs: test-windows-shard
    runs-on: ubuntu-24.04
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm
    steps:
    - name: Confirm Windows Bazel test shards passed
      shell: bash
      run: "if [[ \"${{ needs.test-windows-shard.result }}\" != \"success\" ]]; then\n  echo \"Windows Bazel test shards finished\
        \ with result: ${{ needs.test-windows-shard.result }}\" >&2\n  exit 1\nfi\n"
  clippy:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - os: macos-15
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Prepare Bazel CI
      id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.target }}
        cache-scope: bazel-${{ github.job }}
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\n# Reclaim optional preinstalled SDKs that this Rust/Python/Node matrix does not use.\n# This\
        \ runs only on the disposable hosted runner, outside the source checkout.\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n\
        \  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc\nfi\n# Upstream remote CI also disables the duplicate\
        \ local action cache.\nprintf '\\ncommon --disk_cache=\\n' >> \"$HOME/.bazelrc\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\
        \nbazel info --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"$(grep -oE -- '--disk_cache=[^[:space:]]*'\
        \ \"$rc_log\" | tail -n 1)\"\n[[ \"$last_cache_option\" == --disk_cache= ]]\n"
    - name: bazel build --config=clippy lint targets
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "bazel_clippy_args=(\n  --config=clippy\n  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }}\n  --build_metadata=TAG_job=clippy\n\
        )\nbazel_wrapper_args=()\nbazel_target_list_args=()\nif [[ \"${RUNNER_OS}\" == \"Windows\" ]]; then\n  # Keep this\
        \ aligned with the fast Windows Bazel test job: use\n  # Linux RBE for clippy build actions while targeting Windows\n\
        \  # gnullvm. Fork/community PRs without the BuildBuddy secret fall\n  # back inside `run-bazel-ci.sh` to the previous\
        \ local Windows MSVC\n  # host-platform shape.\n  bazel_wrapper_args+=(--windows-cross-compile)\n  bazel_target_list_args+=(--windows-cross-compile)\n\
        \  if [[ -z \"${BUILDBUDDY_API_KEY:-}\" ]]; then\n    # The fork fallback can see incompatible explicit Windows-cross\n\
        \    # internal test binaries in the generated target list. Preserve\n    # the old local-fallback behavior there.\n\
        \    bazel_clippy_args+=(--skip_incompatible_explicit_targets)\n  fi\nfi\n\nbazel_target_lines=\"$(./scripts/list-bazel-clippy-targets.sh\
        \ \"${bazel_target_list_args[@]}\")\"\nbazel_targets=()\nwhile IFS= read -r target; do\n  bazel_targets+=(\"${target}\"\
        )\ndone <<< \"${bazel_target_lines}\"\n\n./.github/scripts/run-bazel-ci.sh \\\n  --print-failed-action-summary \\\n\
        \  \"${bazel_wrapper_args[@]}\" \\\n  -- \\\n  build \\\n  \"${bazel_clippy_args[@]}\" \\\n  -- \\\n  \"${bazel_targets[@]}\"\
        \n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-clippy-${{ matrix.target }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  verify-release-build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - os: macos-15
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.target-sha }}
        fetch-depth: 0
    - name: Verify exact tested revision and merge parents
      shell: bash
      env:
        TESTED_SHA: ${{ inputs.target-sha }}
        PATCH_SHA: ${{ inputs.patch-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]

        git cat-file -e "$PATCH_SHA^{commit}"

        git cat-file -e "$BASE_SHA^{commit}"

        git merge-base --is-ancestor "$PATCH_SHA" HEAD

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        printf ''tested=%s\npatch=%s\nbase=%s\nworkflow=%s\n'' "$TESTED_SHA" "$PATCH_SHA" "$BASE_SHA" ''${{ github.workflow_sha
        }}''

        git show -s --format=fuller HEAD

        '
    - name: Prepare Bazel CI
      id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ matrix.target }}
        cache-scope: bazel-${{ github.job }}
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\n# Reclaim optional preinstalled SDKs that this Rust/Python/Node matrix does not use.\n# This\
        \ runs only on the disposable hosted runner, outside the source checkout.\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n\
        \  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc\nfi\n# Upstream remote CI also disables the duplicate\
        \ local action cache.\nprintf '\\ncommon --disk_cache=\\n' >> \"$HOME/.bazelrc\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\
        \nbazel info --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"$(grep -oE -- '--disk_cache=[^[:space:]]*'\
        \ \"$rc_log\" | tail -n 1)\"\n[[ \"$last_cache_option\" == --disk_cache= ]]\n"
    - name: bazel build verify-release-build targets
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "# This job exists to compile Rust code behind\n# `cfg(not(debug_assertions))` so PR CI catches failures that would\n\
        # otherwise show up only in a release build. We do not need the full\n# optimizer and debug-info work that normally\
        \ comes with a release\n# build to get that signal, so keep Bazel in `fastbuild` and disable\n# Rust debug assertions\
        \ explicitly.\nbazel_wrapper_args=()\nif [[ \"${RUNNER_OS}\" == \"Windows\" ]]; then\n  # This is build-only signal,\
        \ so use the same Linux-RBE\n  # cross-compile path as the fast Windows test and clippy jobs.\n  # Fork/community\
        \ PRs without the BuildBuddy secret fall back\n  # inside `run-bazel-ci.sh` to the previous local Windows MSVC\n \
        \ # host-platform shape.\n  bazel_wrapper_args+=(--windows-cross-compile)\nfi\n\nbazel_build_args=(\n  --compilation_mode=fastbuild\n\
        \  --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no\n  --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no\n\
        \  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }}\n  --build_metadata=TAG_job=verify-release-build\n  --build_metadata=TAG_rust_debug_assertions=off\n\
        )\n\nbazel_target_lines=\"$(bash ./scripts/list-bazel-release-targets.sh)\"\nbazel_targets=()\nwhile IFS= read -r\
        \ target; do\n  bazel_targets+=(\"${target}\")\ndone <<< \"${bazel_target_lines}\"\n\n./.github/scripts/run-bazel-ci.sh\
        \ \\\n  \"${bazel_wrapper_args[@]}\" \\\n  -- \\\n  build \\\n  \"${bazel_build_args[@]}\" \\\n  -- \\\n  \"${bazel_targets[@]}\"\
        \n"
    - name: Verify Bazel builds bwrap
      if: runner.os == 'Linux'
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "./.github/scripts/run-bazel-ci.sh \\\n  --remote-download-toplevel \\\n  --print-failed-action-summary \\\n  --\
        \ \\\n  build \\\n  --build_metadata=COMMIT_SHA=${{ inputs.target-sha }} \\\n  --build_metadata=TAG_job=verify-bwrap\
        \ \\\n  -- \\\n  //codex-rs/bwrap:bwrap\n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: ${{ inputs.issue }}-bazel-execution-logs-verify-release-build-${{ matrix.target }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
