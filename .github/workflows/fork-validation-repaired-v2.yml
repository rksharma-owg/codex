name: All three patches - eight repairs full CI
'on':
  push:
    branches:
    - codex/full-validation-v2-20261015
permissions:
  contents: read
jobs:
  repair-regressions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-latest
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ab350de537ad87a2690e4d0678b216fc1c68db14
        fetch-depth: 0
        persist-credentials: false
    - name: Verify repaired baseline
      shell: bash
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "ab350de537ad87a2690e4d0678b216fc1c68db14" ]]

        printf "baseline=%s\nworkflow=%s\n" "ab350de537ad87a2690e4d0678b216fc1c68db14" "${{ github.workflow_sha }}"

        '
    - uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || runner.os == 'macOS' && 'aarch64-apple-darwin' ||
          'x86_64-unknown-linux-gnu' }}
        cache-scope: ci-repair-regressions
    - name: Configure storage for public native runners
      shell: bash
      run: "set -euo pipefail\n# Reclaim optional preinstalled SDKs that this Rust/Python/Node matrix does not use.\n# This\
        \ runs only on the disposable hosted runner, outside the source checkout.\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n\
        \  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc\nfi\n# Upstream remote CI also disables the duplicate\
        \ local action cache.\nprintf '\\ncommon --disk_cache=\\n' >> \"$HOME/.bazelrc\"\ndf -h\nrc_log=\"$RUNNER_TEMP/fork-bazel-rc.log\"\
        \nbazel info --announce_rc output_base 2>&1 | tee \"$rc_log\"\nlast_cache_option=\"$(grep -oE -- '--disk_cache=[^[:space:]]*'\
        \ \"$rc_log\" | tail -n 1)\"\n[[ \"$last_cache_option\" == --disk_cache= ]]\n"
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt,clippy
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: 0.11.3
    - name: Verify Rust 1.95
      shell: bash
      run: 'rustc --version --verbose

        cargo --version

        rustc --version | grep -F "rustc 1.95.0 "'
    - name: Pinned V8 Python source wheel with required hash verification
      run: bazel build --lockfile_mode=error '@@rules_python++pip+v8_python_deps_311_markupsafe_sdist_594c6780//:pkg'
    - name: Windows fallback routing controls
      run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s .github/scripts -p test_run_bazel_ci.py
    - name: Formatter discovery and Windows command-size controls
      run: uv run --frozen --project sdk/python --only-group test pytest sdk/python/tests/test_artifact_workflow_and_binaries.py
        -k 'root_fmt or root_format or root_rust_formatter'
    - name: Full repository formatting with all Rust sources
      run: just fmt-check
    - name: Native Windows rustls provider regression
      if: runner.os == 'Windows'
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ''
      run: ./.github/scripts/run-bazel-ci.sh --windows-cross-compile --print-failed-action-summary --print-failed-test-logs
        -- test -- //codex-rs/utils/rustls-provider:rustls-provider-preinstalled-test
    - name: Record lockfile diagnostics
      if: always() && !cancelled()
      shell: bash
      run: 'git diff --stat -- MODULE.bazel.lock

        git diff -- MODULE.bazel.lock > "$CODEX_BAZEL_EXECUTION_LOG_COMPACT_DIR/module-lock.diff"

        '
    - name: Upload repair diagnostics
      if: always() && !cancelled()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: repair-regressions-${{ matrix.os }}
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  focused:
    name: ${{ matrix.patch.issue }} Rust 1.95 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-latest
        patch:
        - issue: '48124'
          branch: fix/reject-invalid-codex-home
          package: codex-utils-home-dir
          head: d8ff80f3301548f06bd128722e97a5a926446bca
          base: ab350de537ad87a2690e4d0678b216fc1c68db14
          merge: 86aee42e7cd1fb5d5182e00c049c28f8d41b177c
          validation_branch: codex/validate-48124-ci-v2
          upstream: bb64b894fd67158be0f874872e6d7bfe717e7368
        - issue: '53935'
          branch: fix/recover-missing-daemon-selection
          package: codex-app-server-daemon
          head: 18bb0ac24b18883cd95fc69bd8f1786672b1414b
          base: ab350de537ad87a2690e4d0678b216fc1c68db14
          merge: cf855247f7cdb23a5e76dd9672273af0f3c92ed0
          validation_branch: codex/validate-53935-ci-v2
          upstream: bb64b894fd67158be0f874872e6d7bfe717e7368
        - issue: '54016'
          branch: fix/resume-settled-error-overrides
          package: codex-app-server
          head: c66117aab2feb4465ac3dbef14254ed16f0a4334
          base: ab350de537ad87a2690e4d0678b216fc1c68db14
          merge: 062239d0a11fc471b527fcb48184d31d0128ad35
          validation_branch: codex/validate-54016-ci-v2
          upstream: bb64b894fd67158be0f874872e6d7bfe717e7368
    env:
      RUST_MIN_STACK: '8388608'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: codex-rs
    steps:
    - name: Preserve committed line endings on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ matrix.patch.merge }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify tested code
      shell: bash
      env:
        PATCH: ${{ matrix.patch.head }}
        TESTED: ${{ matrix.patch.merge }}
        BASE: ${{ matrix.patch.base }}
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$TESTED" ]]

        git merge-base --is-ancestor "$PATCH" HEAD

        git merge-base --is-ancestor "$BASE" HEAD

        printf "tested=%s\npatch=%s\nbase=%s\n" "$TESTED" "$PATCH" "$BASE"

        printf "workflow=%s\n" "${{ github.workflow_sha }}"

        '
    - uses: ./.github/actions/setup-ci
    - name: Install pinned Rust
      uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt,clippy,rust-src
    - name: Verify pinned Rust version
      shell: bash
      run: 'rustc --version --verbose

        cargo --version

        rustc --version | grep -F "rustc 1.95.0 "'
    - name: Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev
    - name: Formatting
      run: cargo fmt -- --config imports_granularity=Item --check
    - name: Regression and crate tests
      shell: bash
      env:
        ISSUE: ${{ matrix.patch.issue }}
        PACKAGE: ${{ matrix.patch.package }}
      run: "set -euo pipefail\nif [[ \"$ISSUE\" == 54016 ]]; then\n  cargo test --locked -p \"$PACKAGE\" --test resume_system_error\n\
        elif [[ \"$ISSUE\" == 53935 ]]; then\n  cargo test --locked -p \"$PACKAGE\" --lib\nelse\n  cargo test --locked -p\
        \ \"$PACKAGE\"\nfi\n"
    - name: Clippy including tests
      if: always() && !cancelled()
      run: cargo clippy --locked -p ${{ matrix.patch.package }} --tests -- -D warnings
    - name: Clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
    needs:
    - repair-regressions
  issue-48124:
    uses: ./.github/workflows/preflight-blocking-ci.yml
    with:
      target-sha: 86aee42e7cd1fb5d5182e00c049c28f8d41b177c
      patch-sha: d8ff80f3301548f06bd128722e97a5a926446bca
      base-sha: ab350de537ad87a2690e4d0678b216fc1c68db14
      issue: '48124'
    needs:
    - repair-regressions
  issue-53935:
    uses: ./.github/workflows/preflight-blocking-ci.yml
    with:
      target-sha: cf855247f7cdb23a5e76dd9672273af0f3c92ed0
      patch-sha: 18bb0ac24b18883cd95fc69bd8f1786672b1414b
      base-sha: ab350de537ad87a2690e4d0678b216fc1c68db14
      issue: '53935'
    needs:
    - repair-regressions
  issue-54016:
    uses: ./.github/workflows/preflight-blocking-ci.yml
    with:
      target-sha: 062239d0a11fc471b527fcb48184d31d0128ad35
      patch-sha: c66117aab2feb4465ac3dbef14254ed16f0a4334
      base-sha: ab350de537ad87a2690e4d0678b216fc1c68db14
      issue: '54016'
    needs:
    - repair-regressions
